<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>行内徽章图、私用区与 Emoji 测试</title>
</head>
<body>
  <main>
    <h1>作者简介与徽章</h1>
    <p>
      <img src="https://cdn.example/icon-deco.png" alt="">
      这是带有标准表情符号 🚀 和 📝 的正常正文段落，同时混入了字体图标私用区字符 &#xE001; 与 &#xF005; 以及变体选择符 &#xFE0F;。
    </p>
    <div class="badge-row">
      <img src="https://cdn.example/b1.png" alt="创作等级LV.4">
      <img src="https://cdn.example/b2.png" alt="杰出作者">
      <img src="https://cdn.example/b3.png" alt="博览群文">
    </div>
    <p>另一段足够长的正文内容用于确保主内容抽取稳定命中整个主体区域，不被当成短导航片段丢弃。</p>
  </main>
</body>
</html>
