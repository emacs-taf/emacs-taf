name: Package installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs: ['29.1', '30.2']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch only the recorded provider commits
        shell: python
        run: |
          import json
          from pathlib import Path
          import re
          import subprocess
          document = json.loads(Path('workspace.json').read_text())
          # Framework providers and applications have separate checkpoints.
          checkpoint = {**document.get('repositories', {}),
                        **document.get('applications', {})}
          selection = json.loads(Path('release-dependencies.json').read_text())['packages']
          for name in selection:
              record = checkpoint[name]
              if not re.fullmatch(r'[a-z][a-z0-9-]*', name):
                  raise SystemExit('Invalid provider directory')
              if not re.fullmatch(r'[0-9a-f]{40}', record['revision']):
                  raise SystemExit('Provider revision must be a full commit ID')
              if Path(name).exists():
                  raise SystemExit(f'Refusing to replace provider directory: {name}')
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True, timeout=120).strip()
              git('init', name)
              git('-C', name, 'remote', 'add', 'origin', record['url'])
              git('-C', name, 'fetch', '--depth=1', 'origin', record['revision'])
              git('-C', name, 'checkout', '--detach', 'FETCH_HEAD')
              if git('-C', name, 'rev-parse', 'HEAD') != record['revision']:
                  raise SystemExit(f'Provider checkpoint mismatch: {name}')
      - name: Install Emacs (Linux/macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}
      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        uses: jcs090218/setup-emacs-windows@3ad415b5f6575fe0bb8218cb35c199a93b1fb833
        with:
          version: ${{ matrix.emacs }}
      - name: Build from the sealed checkpoint
        shell: bash
        run: python scripts/package-release.py build --directory "${{ runner.temp }}/etaf-release"
      - name: Verify every target through both package.el entry paths
        shell: bash
        # Third-party archives occasionally refuse or throttle a runner; a new
        # process retries the whole gate, and only a full pass is evidence.
        run: |
          for attempt in 1 2 3; do
            if python scripts/package-release.py verify --directory "${{ runner.temp }}/etaf-release"; then
              exit 0
            fi
            echo "verify attempt $attempt failed; retrying in 30 seconds" >&2
            sleep 30
          done
          exit 1
      - name: Save successful machine-readable evidence (no profiles or logs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installation-${{ matrix.os }}-${{ matrix.emacs }}
          path: |
            ${{ runner.temp }}/etaf-release/manifest.json
            ${{ runner.temp }}/etaf-release/installation.json
          if-no-files-found: error
          retention-days: 14
      - name: Save failure diagnostics for maintainers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installation-failure-${{ matrix.os }}-${{ matrix.emacs }}
          path: ${{ runner.temp }}/etaf-release/installation-*.log
          if-no-files-found: ignore
          retention-days: 14
