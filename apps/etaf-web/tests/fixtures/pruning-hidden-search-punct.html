<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>隐藏节点、搜索条与标点块测试</title>
</head>
<body>
  <main>
    <h1>系统设计说明</h1>
    <div style="display: none">不应该出现的隐藏提示文本</div>
    <span style="visibility: hidden">同样不可见的悬浮文案</span>
    <div role="tooltip">悬浮提示：点击复制链接</div>
    <div role="menu"><span>菜单项一</span><span>菜单项二</span></div>
    <div role="dialog"><span>登录弹窗标题</span><button>立即登录</button></div>
    <div role="alertdialog"><span>警告弹窗</span></div>
    <div class="search-wrap">
      <input type="search" placeholder="搜索文章">
      <button>搜索</button>
    </div>
    <div class="sep-bar">
      <div>|</div>
      <div>·</div>
      <div>/</div>
    </div>
    <p>这是正常保留的主体正文段落，长度足够并且包含有意义的技术说明，用来验证只有非文档装饰节点被裁剪。</p>
    <div role="tablist">
      <button role="tab" aria-controls="p1" aria-selected="true">Linux</button>
      <button role="tab" aria-controls="p2" aria-selected="false">macOS</button>
    </div>
    <div id="p1" role="tabpanel"><pre><code class="language-sh">make check</code></pre></div>
    <div id="p2" role="tabpanel" style="display: none"><pre><code class="language-sh">make test</code></pre></div>
  </main>
</body>
</html>
