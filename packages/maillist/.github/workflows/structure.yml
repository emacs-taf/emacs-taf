name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install batch Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      - name: Fetch API provider sources
        run: |
          if [ -f workspace.json ]; then
            python3 scripts/check-api.py --workspace . --fetch-providers
          else
            python3 scripts/check-api.py --root . --fetch-providers --providers-dir ..
          fi
      - run: python3 scripts/check-repository.py
      - name: Byte compilation
        run: make compile
      - name: Policy regression tests (workspace)
        run: |
          if [ -f workspace.json ]; then
            python3 -m unittest discover -s tests/tools -p 'test_*.py'
          fi
      - name: Acceptance scenarios
        run: make test
      - name: Verify public entry bindings and signatures
        run: make api-check
