name: Repository structure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check repository structure and public API boundaries
        run: |
          if [ -f workspace.json ] && { [ -d core/packages ] || [ -d packages ]; }; then
            make structure-check
          elif [ -f workspace.json ]; then
            python3 scripts/check-api.py --workspace . --fetch-providers
            python3 scripts/check-repository.py
          else
            python3 scripts/check-api.py --root . --fetch-providers --providers-dir ..
            python3 scripts/check-repository.py
          fi
      - name: Install batch Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          if [ -d core/packages/etaf-posframe ] || [ -d packages/etaf-posframe ]; then
            mkdir -p "$HOME/.emacs.d/elpa"
            git clone --depth=1 https://github.com/tumashu/posframe.git "$HOME/.emacs.d/elpa/posframe-ci"
          fi
      - name: Policy regression tests (workspace)
        run: |
          if [ -f workspace.json ]; then
            python3 -m unittest discover -s tests/tools -p 'test_*.py'
          fi
      - name: Verify public entry bindings and signatures
        run: make api-check
