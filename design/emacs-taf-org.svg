<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- emacs-taf organization icon (source). Render the avatar with:
       rsvg-convert -w 512 -h 512 assets/emacs-taf-org.svg -o emacs-taf-org.png -->
  <title>emacs-taf</title>
  <desc>A text application window with a caret, on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="76" y="96" width="360" height="320" rx="28" fill="#0B1220" stroke="#334155" stroke-width="3"/>
  <line x1="77" y1="148" x2="435" y2="148" stroke="#334155" stroke-width="3"/>
  <rect x="108" y="184" width="196" height="26" rx="13" fill="#64748B"/>
  <rect x="108" y="238" width="140" height="26" rx="13" fill="#94A3B8"/>
  <rect x="264" y="230" width="20" height="42" rx="7" fill="url(#accent)"/>
  <rect x="108" y="292" width="248" height="26" rx="13" fill="#475569"/>
  <rect x="108" y="346" width="120" height="26" rx="13" fill="#334155"/>
</svg>
