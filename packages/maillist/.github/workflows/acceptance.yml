name: Acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install batch Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
      # The client is an application: its providers live beside it, so the
      # structure workflow's fetch supplies the checkouts that compile and the
      # acceptance suite load.
      - name: Fetch provider sources
        run: python3 scripts/check-api.py --root . --fetch-providers --providers-dir ..
      - name: Byte compilation
        run: make compile
      - name: Acceptance scenarios
        run: make test
